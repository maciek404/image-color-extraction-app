<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <div class="content-wrapper">
            <header>
                <h1>Color Extractor</h1>
                <p class="subtitle">Upload an image and discover its dominant color palette.</p>
            </header>

            <img id="image-preview" class="preview-thumb hidden" alt="Preview of the uploaded image">

            <div class="source-toggle">
                <button type="button" class="toggle-btn active" data-mode="file">File</button>
                <button type="button" class="toggle-btn" data-mode="url">URL</button>
            </div>

            <form id="analyze-form" class="upload-form">
                <div class="form-grid">
                    <div id="file-mode" class="field">
                        <div class="field-control">
                            <input type="file" id="file-input" accept="image/*">
                            <label for="file-input" class="file-label">Upload image</label>
                        </div>
                    </div>

                    <div id="url-mode" class="field hidden">
                        <div class="field-control">
                            <input type="url" id="url-input" placeholder="https://...">
                        </div>
                    </div>

                    <div class="field">
                        <span class="field-label">Accuracy: <span id="bucket-value">32</span></span>
                        <div class="field-control">
                            <input type="range" id="bucket-slider" min="8" max="64" step="8" value="32">
                        </div>
                    </div>

                    <div class="field">
                        <span class="field-label">Number of colors</span>
                        <div class="field-control">
                            <select id="top-n-select">
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <span class="field-label">&nbsp;</span>
                        <div class="field-control">
                            <button type="submit" id="analyze-btn">Analyze</button>
                        </div>
                    </div>
                </div>
            </form>

            <p id="error-message" class="error-message hidden"></p>
        </div>
    </main>

    <div class="palette-wrapper">
        <div id="palette" class="palette"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
